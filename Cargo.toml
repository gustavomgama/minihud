[workspace]
members = [
    ".",
    "xtask",
    "crates/hook-ipc",
    "crates/hook-rt",
    "crates/hook-test",
    "crates/hook-vk-layer",
]

[package]
name = "minihud"
version = "0.1.0"
edition = "2021"
authors = ["minihud"]
description = "Headless LibreHardwareMonitor hardware-stats backend for Windows"
license = "MIT"
repository = "https://github.com/helmet/minihud"
readme = "README.md"

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hook-ipc = { path = "crates/hook-ipc" }

[dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Console",
  "Win32_System_Threading",
  "Win32_System_Memory",
  "Win32_System_LibraryLoader",
  "Win32_System_Performance",
]

# Behavior-neutral release tuning only. Panic strategy is intentionally left
# at the default so debug and release fail identically.
[profile.release]
strip = true
lto = "thin"
