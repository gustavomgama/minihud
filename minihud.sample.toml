# minihud sample config — copy to `minihud.toml` next to minihud.exe.
# Precedence: anything listed here overrides the built-in defaults, per
# key — a file with a single line works; omit what you don't care about.
# Unknown keys are ignored; unparseable files fall back to all-defaults
# with a log warning (a typo never wedges the overlay).

# Overlay position, pixels from top-left. Rewritten automatically
# whenever you drag the window (F8 off to unlock dragging).
x = 16
y = 16

# Text opacity, 0.2..=1.0. Applies to text/graph only;
# the window background itself stays opaque.
opacity = 0.95

# Body font size in pt, clamped 10..=28. Headline FPS renders ~1.8x.
text_size = 14.0

# Game frametime graph (fixed 50ms ceiling + 16.7ms target line).
show_frametime_graph = true

# Hardware poll interval in ms while values move, clamped 50..=5000.
# Covers CPU/RAM/GPU/VRAM/temp/power/clocks (PDH/NVML/LHM).
update_hw_ms = 700

# Idle backoff cap in ms, clamped to >= update_hw_ms, <= 10000.
# After 4 quiet polls the interval doubles toward this.
idle_hw_ms = 2000

# Start click-through (mouse passes to the game). F8 toggles live.
click_through = true

# NOTE: per-app tracking has no config key — use the CLI:
#   minihud.exe --process Overwatch.exe   (name substring, any case)
#   minihud.exe --process 1234            (exact PID)
# Keys: F7 show/hide, F8 click-through, Shift+F7 clean quit.
