name: audit

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache cargo + installed bins
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: true

      - name: Install tools (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny,cargo-audit,cargo-machete,cargo-llvm-cov

      - name: Install quality tools (pinned)
        # Versions pinned to the ones the local pre-push gate runs, so CI and
        # local never drift. Binaries restored from the Swatinem cache-bin cache
        # are skipped; a transient registry failure is retried instead of
        # redding the job (that unpinned-install flake is what broke this step).
        # Gate tools (cargo-crap, jscpd) must install; the advisory tools
        # (rustqual, mete) only warn — their steps are continue-on-error anyway.
        shell: pwsh
        run: |
          $gates = @{ 'cargo-crap' = 'cargo-crap@0.6.1'; 'jscpd' = 'jscpd-rs@0.1.12' }
          $advisory = @{ 'rustqual' = 'rustqual@1.8.3'; 'mete' = 'mete@0.1.2' }
          $failed = @()
          foreach ($map in @($gates, $advisory)) {
            foreach ($cmd in $map.Keys) {
              if (Get-Command $cmd -ErrorAction SilentlyContinue) { continue }
              $ok = $false
              foreach ($attempt in 1..3) {
                cargo install $($map[$cmd])
                if ($LASTEXITCODE -eq 0) { $ok = $true; break }
                Write-Host "install $cmd failed (attempt $attempt of 3)"
                Start-Sleep -Seconds 20
              }
              if (-not $ok) { $failed += $cmd }
            }
          }
          foreach ($cmd in $gates.Keys) {
            if ($failed -contains $cmd) { throw "gate tool install failed: $cmd" }
          }
          foreach ($cmd in $advisory.Keys) {
            if ($failed -contains $cmd) { Write-Host "::warning::advisory tool $cmd not installed; its report is skipped" }
          }

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        # Same check the local pre-push gate runs; retried because a transient
        # crates.io fetch on a cold runner is indistinguishable from a lint
        # failure in the log-less red X, and on final failure the error tail is
        # published as a check-run annotation (visible without workflow-read
        # access) so the cause is never a mystery.
        shell: pwsh
        run: |
          $ok = $false
          foreach ($attempt in 1..3) {
            $out = cargo clippy --workspace --all-targets -- -D warnings 2>&1
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            $tail = ($out | Select-Object -Last 20) -join '%0A'
            Write-Host "::error::clippy failed (attempt $attempt of 3): $tail"
            Start-Sleep -Seconds 15
          }
          if (-not $ok) { exit 1 }

      - name: test (nextest)
        run: cargo nextest run --workspace --no-tests=pass

      - name: unused deps (cargo-machete)
        run: cargo machete

      - name: licenses / bans / sources (cargo-deny)
        run: cargo deny check

      - name: advisories (cargo-audit)
        run: cargo audit

      - name: coverage (cargo-llvm-cov)
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: CRAP gate (cargo-crap)
        # Scores the shipped product code: excludes the entry point, the build
        # script and xtask. `--allow` hides the LHM bridge's live-only
        # supervisor functions (`run`/`session`) — they only run against a real
        # PowerShell child, so no in-process unit test can cover them.
        run: cargo crap --lcov lcov.info --exclude 'src/main.rs' --exclude 'build.rs' --exclude 'xtask/**' --allow 'run' --allow 'session' --threshold 30 --fail-above

      - name: duplication gate (jscpd)
        run: jscpd src --min-lines 5 --threshold 5

      - name: rustqual (advisory)
        continue-on-error: true
        run: rustqual --coverage lcov.info --no-fail

      - name: mete (advisory)
        continue-on-error: true
        run: mete analyze src

      - name: upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: ignore
