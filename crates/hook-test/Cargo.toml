[package]
name = "hook-test"
version = "0.1.0"
edition = "2021"
description = "Validation harness: hidden D3D11 window presenting exactly N frames. Ground truth for hook-rt counts."
license = "MIT"

[[bin]]
name = "hook-test"
path = "src/main.rs"

[dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
]
