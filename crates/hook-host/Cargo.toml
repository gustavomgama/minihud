[package]
name = "hook-host"
version = "0.1.0"
edition = "2021"
description = "Launcher/injector + shared-memory frame reader for hook-rt. Supervises the hook; never touches game code paths."
license = "MIT"

[[bin]]
name = "hook-host"
path = "src/main.rs"

[dependencies]
hook-ipc = { path = "../hook-ipc" }

[dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_Memory",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_LibraryLoader",
]
