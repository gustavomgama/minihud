[package]
name = "hook-vk-layer"
version = "0.1.0"
edition = "2021"
publish = false
description = "minihud Vulkan implicit layer: records vkQueuePresentKHR timestamps into the shared frame ring"
license = "MIT"

# `rlib` in addition to `cdylib` so the pure logic (name dispatch, ring math)
# is exercised by `cargo test`/`nextest` in the lib test harness; the `cdylib`
# is the layer the Vulkan loader loads (`hook_vk_layer.dll`).
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hook-ipc = { path = "../hook-ipc" }

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
  "Win32_System_Performance",
]
