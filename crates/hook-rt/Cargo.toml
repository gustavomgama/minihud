[package]
name = "hook-rt"
version = "0.1.0"
edition = "2021"
description = "Injected frame-timestamp hook (cdylib). Records presents into shared memory; never blocks, allocates, or panics in the target."
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
hook-ipc = { path = "../hook-ipc" }
min_hook_rs = "2"

[dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Performance",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
]
